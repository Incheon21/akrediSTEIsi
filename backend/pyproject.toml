[project]
name = "stei-accreditation-backend"
version = "0.1.0"
description = "IABEE Accreditation Management System - Backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "email-validator>=2.2.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.0",
    "docxtpl>=0.20.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
seed = "scripts.seed:seed"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
