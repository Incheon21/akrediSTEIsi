stages:
  - lint
  - test
  - security
  - build

default:
  tags:
    - gitlab--duo

frontend-lint:
  stage: lint
  image: node:22-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  # Advisory until the existing lint errors are resolved.
  # ESLint configuration errors (exit code 2) still fail the pipeline.
  allow_failure:
    exit_codes: 1
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund || exit 2
  script:
    - npm run lint -- --format stylish --output-file eslint-report.txt
  after_script:
    - cat frontend/eslint-report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/eslint-report.txt

backend-lint:
  stage: lint
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  # Advisory while existing lint findings are being cleaned up.
  # Installation/configuration failures still block the pipeline.
  allow_failure:
    exit_codes: 1
  before_script:
    - pip install --no-cache-dir ruff==0.11.13 || exit 2
  script:
    - ruff check backend --target-version py313 --select E4,E7,E9,F --output-format concise --output-file ruff-report.txt
  after_script:
    - cat ruff-report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ruff-report.txt

backend-sast:
  stage: security
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - pip install --no-cache-dir bandit==1.9.4
  script:
    # Run from the repository root, scanning application code without the
    # legacy backend/.bandit exclusions. Medium/high findings fail this job.
    - bandit -r backend/app --severity-level medium --format json --output bandit-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - bandit-report.json

run-tests:
  stage: test
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev)$/
  before_script:
    - apt-get update && apt-get install -y curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - . "$HOME/.local/bin/env"
    - cp ./backend/.env.example ./backend/.env
    - cd backend && uv sync
  script:
    - chmod +x ./tests/run_tests.sh
    - bash ./tests/run_tests.sh

frontend-build:
  stage: build
  image: node:22-slim
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run build

backend-build:
  stage: build
  image: python:3.13-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - . "$HOME/.local/bin/env"
    - cd backend
  script:
    - uv sync --frozen --no-dev
    - uv build
