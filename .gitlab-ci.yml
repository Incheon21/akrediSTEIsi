stages:
  - build

docker-build:
  stage: build

  image:
    name: docker:29
  services:
   - name: docker:29-dind
     alias: thedockerhost

  variables:
    DOCKER_HOST: tcp://thedockerhost:2375/
    DOCKER_TLS_CERTDIR: "/certs"
    TAG: $CI_COMMIT_SHORT_SHA        # e.g. a1b2c3d4
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - apk add --no-cache bash python3
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker compose build
    - docker compose push

  only:
    - main
    - dev

